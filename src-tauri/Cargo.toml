[package]
name = "octodock"
version = "0.1.0"
description = "OctoDock — multi-service floating dock"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "octodock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
# "unstable" enables Window::add_child / WebviewBuilder — required for
# embedding services as child webviews *inside* the main window instead of
# as separate owned top-level windows. Owned windows are always drawn above
# their owner by the OS and can end up mis-sized/mis-positioned as a
# seemingly-detached floating window; child webviews are clipped to and move
# with their parent window by construction, so that failure mode can't occur.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Optional auto-updater, off by default — see docs/updater.md before enabling.
tauri-plugin-updater = { version = "2", optional = true }

[features]
# Disabled until a signing keypair + update endpoint are configured; see
# docs/updater.md. Enable with `cargo build --features updater` (or add it
# to the default feature set once ready to ship auto-updates).
updater = ["dep:tauri-plugin-updater"]

[profile.dev]
debug = 0
incremental = false
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
